name: Bridgefort documentation release checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/documentation-automation-off-switch

permissions:
  contents: read

jobs:
  documentation-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify legal-document delivery fails closed by default
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';

          const read = (path) => readFileSync(path, 'utf8');
          const migration = read('supabase/migrations/20261015120000_transaction_document_delivery_automation_controls.sql');
          const manual = read('supabase/functions/send-transaction-document/index.ts');
          const automatic = read('supabase/functions/auto-send-contract-of-sale/index.ts');
          const queue = read('src/components/admin/DocumentationWorkflow.tsx');
          const controls = read('src/components/admin/TransactionDocumentDeliveryAutomation.tsx');
          const admin = read('src/components/admin/AdminClientEngagementAutomations.tsx');

          assert.match(migration, /values\s*\(\s*'contract_of_sale'\s*,\s*false\s*\),\s*\(\s*'deed_of_assignment'\s*,\s*false\s*\)/i, 'both controls must seed OFF');
          assert.match(manual, /deliveryControl\?\.enabled\s*!==\s*true/, 'manual delivery must fail closed');
          assert.match(automatic, /deliveryControl\?\.enabled\s*!==\s*true/, 'automatic delivery must fail closed');
          assert.match(queue, /!deliveryControlsAvailable\s*\|\|\s*deliveryControls\[type\]\s*!==\s*true/, 'queue must block if controls are missing or OFF');
          assert.match(controls, /No email was sent by this switch/, 'switch must not itself send mail');
          assert.match(admin, /TransactionDocumentDeliveryAutomation/, 'admin automation panel must mount the controls');
          console.log('Legal-document automation safety assertions passed.');
          NODE

      - name: Lint
        run: npm run lint

      - name: Production build
        if: always()
        run: npm run build
