name: Bridgefort documentation release checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/documentation-automation-off-switch
      - release/documentation-workflow-clean-main

permissions:
  contents: read

jobs:
  documentation-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify legal-document delivery fails closed by default
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';

          const read = (path) => readFileSync(path, 'utf8');
          const migration = read('supabase/migrations/20261015213539_transaction_document_delivery_automation_controls.sql');
          const readiness = read('supabase/migrations/20261015214129_guard_transaction_document_delivery_controls.sql');
          const manual = read('supabase/functions/send-transaction-document/index.ts');
          const automatic = read('supabase/functions/auto-send-contract-of-sale/index.ts');
          const queue = read('src/components/admin/DocumentationWorkflow.tsx');
          const controls = read('src/components/admin/TransactionDocumentDeliveryAutomation.tsx');
          const admin = read('src/components/admin/AdminClientEngagementAutomations.tsx');

          assert.match(migration, /values\s*\(\s*'contract_of_sale'\s*,\s*false\s*\),\s*\(\s*'deed_of_assignment'\s*,\s*false\s*\)/i, 'both controls must seed OFF');
          assert.match(readiness, /before insert or update of enabled, document_type/i, 'database must gate control changes');
          assert.match(readiness, /Cannot enable legal-document email delivery until the matching template is approved/i, 'database must reject unapproved legal templates');
          assert.match(readiness, /update public\.transaction_document_automation_controls\s+set enabled = false/i, 'database must turn delivery OFF if a template becomes unapproved');
          assert.match(manual, /deliveryControl\?\.enabled\s*!==\s*true/, 'manual delivery must fail closed');
          assert.match(automatic, /deliveryControl\?\.enabled\s*!==\s*true/, 'automatic delivery must fail closed');
          assert.match(manual, /const propertyPaid = total > 0 && balance <= 0 && paid >= total && \["paid", "completed"\]\.includes\(status\)/, 'manual Contract of Sale requires full confirmed property payment');
          assert.match(manual, /\.in\("status", \["approved", "paid", "completed"\]\)/, 'documentation fee gate must use confirmed statuses');
          assert.match(manual, /Number\(payment\.amount \|\| 0\) >= Number\(payment\.total_bundle_amount \|\| 0\)/, 'documentation fee gate must confirm the full bundle amount');
          assert.match(automatic, /request\.status !== "approved"/, 'automatic delivery requires an approved payment request');
          assert.match(automatic, /String\(request\.type\)\.toLowerCase\(\) !== "property"/, 'automatic delivery only applies to property purchase requests');
          assert.match(automatic, /paid >= total && balance <= 0/, 'automatic delivery requires the order to be fully paid');
          assert.match(automatic, /!template\?\.enabled/, 'automatic delivery requires an enabled legal template');
          assert.match(automatic, /ESTATE-SPECIFIC\|CURRENT APPROVED\|VERIFY/, 'automatic delivery blocks unresolved legal placeholders');
          assert.match(queue, /!deliveryControlsAvailable\s*\|\|\s*deliveryControls\[type\]\s*!==\s*true/, 'queue must block if controls are missing or OFF');
          assert.match(controls, /No email was sent by this switch/, 'switch must not itself send mail');
          assert.match(controls, /!templateReady\[doc\.type\] && control\?\.enabled !== true/, 'UI must disable switches until legal templates are approved');
          assert.match(admin, /TransactionDocumentDeliveryAutomation/, 'admin automation panel must mount the controls');
          console.log('Legal-document automation safety assertions passed.');
          NODE

      - name: Verify BMC agreement, division and approval migration safeguards
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';

          const acceptance = readFileSync('supabase/migrations/20261121134852_bmc_agreement_acceptance_audit.sql', 'utf8');
          const divisions = readFileSync('supabase/migrations/20261121134906_bmc_division_applications.sql', 'utf8');
          const security = readFileSync('supabase/migrations/20261121134914_secure_bmc_division_review.sql', 'utf8');
          const signup = readFileSync('src/pages/Auth.tsx', 'utf8');
          const hub = readFileSync('src/pages/BMCPartnerHub.tsx', 'utf8');
          const admin = readFileSync('src/components/admin/AdminBMCApplications.tsx', 'utf8');
          const adminConsole = readFileSync('src/pages/AdminConsole.tsx', 'utf8');
          const referrals = readFileSync('supabase/migrations/20261121134923_bmc_division_referral_attribution.sql', 'utf8');
          const reviewerPermission = readFileSync('supabase/migrations/20261121134932_bmc_reviewer_permission.sql', 'utf8');
          const travelForm = readFileSync('src/components/travels/TravelsBookingForm.tsx', 'utf8');
          const travelEdge = readFileSync('supabase/functions/submit-travel-booking/index.ts', 'utf8');
          const checkoutForm = readFileSync('src/components/ecommerce/CheckoutForm.tsx', 'utf8');
          const checkoutEdge = readFileSync('supabase/functions/create-checkout-order/index.ts', 'utf8');
          const agrovestCategory = readFileSync('src/pages/AgrovestCategoryDetail.tsx', 'utf8');
          const agrovestLanding = readFileSync('src/pages/Agrovest.tsx', 'utf8');
          const travelsPage = readFileSync('src/pages/Travels.tsx', 'utf8');
          const travelDestination = readFileSync('src/pages/TravelDestination.tsx', 'utf8');

          assert.match(acceptance, /create table if not exists public\.bmc_agreement_acceptances/i);
          assert.match(acceptance, /revoke all on public\.bmc_agreement_acceptances from anon, authenticated/i);
          assert.match(acceptance, /after insert on auth\.users/i);
          assert.match(divisions, /unique \(user_id, division\)/i, 'one independent application per division');
          assert.match(divisions, /create table if not exists public\.bmc_partner_division_audit/i);
          assert.match(divisions, /create or replace function public\.request_bmc_division_application/i);
          assert.match(divisions, /create or replace function public\.create_bmc_division_applications/i);
          assert.match(security, /create trigger protect_bmc_membership_fields\s+before insert or update on public\.profiles/i);
          assert.match(security, /revoke update \(application_status, reviewed_at, updated_at\)\s+on public\.bmc_partner_divisions from anon, authenticated/i);
          assert.match(security, /drop policy if exists "BMC approvers can update division application status"/i);
          assert.doesNotMatch(security, /current_setting\('bridgefort\.bmc_membership_sync'/i, 'client-settable custom GUCs must never bypass profile membership guards');
          assert.match(security, /create or replace function public\.admin_list_bmc_division_audit/i);
          assert.match(security, /create or replace function public\.admin_review_bmc_division_application/i);
          assert.match(security, /BMC Agreement acceptance and privacy acknowledgement are required before approval/i);
          assert.match(security, /admin:manage_bmc_partners/i, 'BMC decisions require dedicated management permission');
          assert.match(reviewerPermission, /admin:manage_bmc_partners/i);
          assert.match(reviewerPermission, /'super_admin'.*'admin:manage_bmc_partners'/i);
          assert.match(reviewerPermission, /'manager'.*'admin:manage_bmc_partners'/i);
          assert.match(security, /Invalid BMC application status transition/i);
          assert.match(security, /A review reason is required for rejection or suspension/i);
          assert.doesNotMatch(security, /sync_bmc_homes_membership/i, 'BMC Homes approval must not activate paid BH-Realtors membership');
          assert.match(security, /BMC Homes approval is intentionally separate from legacy BH-Realtors paid/i);
          assert.match(signup, /bmc_selected_divisions: selectedBmcDivisions/i);
          assert.doesNotMatch(signup, /profileUpdate\.is_pbo\s*=/i);
          assert.doesNotMatch(signup, /profileUpdate\.current_package\s*=/i);
          assert.match(signup, /bmc_referral_code: bmcReferralCode/i);
          assert.match(signup, /BH-Realtors Referral Code/i, 'legacy sponsor-code field must be clearly separated from BMC division codes');
          assert.doesNotMatch(signup, /sponsoring BMC, enter their code/i, 'do not route BMC codes through the legacy BH-Realtors sponsor field');
          assert.match(hub, /request_bmc_division_application/i);
          assert.match(admin, /_review_note: reviewNote \|\| null/i);
          assert.match(admin, /Review reason required/i);
          assert.match(admin, /admin_list_bmc_division_audit/i);
          assert.match(admin, /Review history/i);
          assert.match(admin, /canManage/i, 'decision controls must be hidden from view-only approvers');
          assert.match(adminConsole, /canManage=\{hasPermission\('admin:manage_bmc_partners'\) \|\| hasPermission\('admin:all'\) \|\| isGlobalAdmin\}/i);
          assert.match(referrals, /create table if not exists public\.bmc_division_referral_codes/i);
          assert.match(referrals, /create table if not exists public\.bmc_division_referral_attributions/i);
          assert.match(referrals, /get_my_bmc_division_referral_codes/i);
          assert.match(referrals, /record_bmc_homes_signup_referral/i);
          assert.match(referrals, /division in \('homes', 'travels', 'agrovest'\)/i);
          assert.match(referrals, /division = 'travels'/i);
          assert.match(referrals, /division = 'agrovest'/i);
          assert.match(travelForm, /bmc_referral_code: bmcReferralCode/i);
          assert.match(travelEdge, /bmc_referral_code_id: bmcReferralCodeId/i);
          assert.match(checkoutForm, /bmcReferralCode/i);
          assert.match(checkoutEdge, /bmc_referral_code_id: bmcReferralCodeId/i);
          assert.match(agrovestLanding, /referralQuery/i, 'Agrovest landing-page category links must preserve BMC referrals');
          assert.match(agrovestLanding, /bmcReferralCode,/i, 'Agrovest landing-page checkout must retain BMC referral attribution');
          assert.match(agrovestCategory, /bmcReferralCode,/i, 'Agrovest category pages must carry BMC referral codes into the cart');
          assert.match(agrovestCategory, /referralQuery/i, 'Agrovest category navigation must preserve the referral query');
          assert.match(travelsPage, /referralQuery/i, 'Travel destination navigation must preserve the referral query');
          assert.match(travelDestination, /referralQuery/i, 'Travel destination enquiry links must preserve the referral query');
          console.log('BMC division referral attribution safeguards passed.');
          console.log('BMC migration and UI safeguard assertions passed.');
          NODE

      - name: Verify BMC division commission separation and safeguards
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';

          const migration = readFileSync('supabase/migrations/20261121150000_bmc_division_commission_engine.sql', 'utf8');
          const assertions = readFileSync('supabase/tests/bmc_migration_assertions.sql', 'utf8');
          const partnerHub = readFileSync('src/pages/BMCPartnerHub.tsx', 'utf8');

          assert.match(migration, /create table if not exists public\\.bmc_division_commissions/i);
          assert.match(migration, /division text not null check \\(division in \\('agrovest', 'travels'\\)\\)/i);
          assert.match(migration, /commission_rate numeric\\(5,2\\) not null check \\(commission_rate = 10\\.00\\)/i);
          assert.match(migration, /gross_customer_payment/i, 'commission basis must be gross customer payment');
          assert.match(migration, /round\\(gross_amount \\* 0\\.10, 2\\)/i);
          assert.match(migration, /admin_record_bmc_travel_payment/i, 'travel payment must be explicitly confirmed by an authorized manager');
          assert.match(migration, /bmc_award_agrovest_order_commission/i);
          assert.match(migration, /bmc_award_travel_commission_from_payment/i);
          assert.match(migration, /get_my_bmc_division_commissions/i);
          assert.match(migration, /admin_mark_bmc_commission_paid/i);
          assert.doesNotMatch(migration, /mlm_commissions|wallet_balance|referred_by_id/i, 'BMC division commissions must not touch BH-Realtors MLM upliners or wallets');
          assert.match(assertions, /Agrovest commission was not calculated as 10%/i);
          assert.match(assertions, /Travels commission was not calculated as 10%/i);
          assert.match(assertions, /duplicate or upliner commission rows/i);
          assert.match(partnerHub, /get_my_bmc_division_referral_codes/i, 'existing partner hub referral workflow must remain intact');
          console.log('BMC division commission separation and safeguards passed.');
          NODE

      - name: Lint
        run: npm run lint

      - name: Production build
        if: always()
        run: npm run build
