name: Repair mailbox UI wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch mailbox provider and Gmail OAuth wiring
        shell: python
        run: |
          from pathlib import Path

          changes = {
              Path('src/components/admin/AdminEmailCenter.tsx'): [
                  ("supabase.functions.invoke('gmail-oauth-start')",
                   "supabase.functions.invoke('gmail-oauth-start', { body: { mailboxEmail } })"),
              ],
              Path('src/components/admin/AdminMailboxManagement.tsx'): [
                  ("supabase.from('admin_mailboxes').upsert(payload, { onConflict: 'user_id,mailbox_email' })",
                   "supabase.from('admin_mailboxes').upsert(payload, { onConflict: 'user_id,mailbox_email,mailbox_provider' })"),
              ],
          }

          changed = []
          for path, replacements in changes.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No source files changed; refusing to create a no-op repair commit.')

          print('Patched:', ', '.join(changed))

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AdminEmailCenter.tsx src/components/admin/AdminMailboxManagement.tsx
          git commit -m "fix(mail): bind Gmail OAuth to selected mailbox and provider"
          git push

      - name: Remove temporary repair workflow
        if: success()
        run: |
          git rm .github/workflows/repair-mailbox-ui.yml
          git commit -m "chore: remove temporary mailbox repair workflow"
          git push
