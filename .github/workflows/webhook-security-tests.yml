name: Webhook security tests

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/webhook-security-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/webhook-security-tests.yml"

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test webhook security helpers
        run: deno test supabase/functions/_shared/webhookSecurity_test.ts
